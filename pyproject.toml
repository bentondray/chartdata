[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bentondray-chartdata"
version = "0.1.0"
description = "检查数值与坐标轴的关系、总量与分项的一致性，标出对不上的"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bentondray" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bentondray.github.io"
Repository = "https://github.com/bentondray/chartdata"
Issues = "https://github.com/bentondray/chartdata/issues"

[project.scripts]
chartdata = "chartdata:main"

[tool.setuptools]
py-modules = ["chartdata"]
